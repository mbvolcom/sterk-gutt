<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connecting Strava…</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #07080c; color: #e8eaf0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; flex-direction: column; gap: 16px; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(0,180,255,0.2); border-top-color: #00b4ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 13px; color: #4a5068; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="spinner"></div>
<p>CONNECTING STRAVA…</p>
<script>
  const params = new URLSearchParams(window.location.search);
  const code  = params.get('code');
  const error = params.get('error');

  if (error || !code) {
    document.querySelector('p').textContent = 'Connection failed. Redirecting…';
    setTimeout(() => window.location.href = '/?strava=error', 2000);
  } else {
    // Forward the code to the Supabase Edge Function
    window.location.href =
      'https://fzbovpdnpvsfdnxyftqv.supabase.co/functions/v1/strava-auth?code=' + code;
  }
</script>
</body>
</html>
